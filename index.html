<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QR Code Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <div class="container mt-5">
      <h1>Text to QR Generator</h1>
      <form action="/generate" method="POST">
        <div class="mb-3">
          <label for="text_input" class="form-label">Text</label>
          <input type="text" class="form-control" id="text_input" name="text" required>
        </div>
        <button type="submit" class="btn btn-primary">Generate QR Code</button>
      </form>
      
      {% if qr_code %}
      <div class="mt-4">
        <h3>Generated QR Code for: {{ text }}</h3>
        <img src="{{ url_for('static', filename=qr_code) }}" alt="QR Code" class="img-fluid">
      </div>
      {% endif %}
      
      {% if error %}
      <div class="alert alert-danger mt-3">{{ error }}</div>
      {% endif %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
